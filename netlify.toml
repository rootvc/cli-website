[build]
  # Produces dist/ from scratch: vendor assets, the app bundle, and the static
  # mirror generated from config/*.js. Publishing the build output rather than
  # the repo means the mirror is regenerated on every deploy, no generated file
  # is ever committed, and scripts/, tests/, and config metadata stay unserved.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # This site predates Node pinning, so Netlify was defaulting to whatever
  # version it was created with. That was fine while the build only used
  # fs.copyFileSync and friends, but scripts/build-assets.js now uses
  # fs.cpSync (Node >= 16.7) and fs.rmSync (>= 14.14). Pin to the same
  # version CI runs (.github/workflows/test.yml) so a green CI run means the
  # deploy will build too.
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
